name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"

      - name: Run the hooks on the files this PR changes
        env:
          # Both are about commits; gitleaks gets its own step below.
          SKIP: gitleaks,no-commit-to-branch
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uvx pre-commit@4.6.2 run --show-diff-on-failure
          --from-ref "origin/$BASE_REF" --to-ref HEAD

      - name: Scan this PR's commits for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          tarball=gitleaks_8.30.1_linux_x64.tar.gz
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$tarball"
          echo "$sha  $tarball" | sha256sum -c -
          mkdir gitleaks
          tar -xzf "$tarball" -C gitleaks
          ./gitleaks/gitleaks git --redact --no-banner --log-opts="origin/$BASE_REF..HEAD" .

      - name: Check the workflows, including for known vulnerable actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 .github/workflows
