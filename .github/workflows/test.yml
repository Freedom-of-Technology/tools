# Runs the tests, and checks Cloudflare would accept wrangler.toml, on every change.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # A Worker that can't start fails its tests but can keep the run from ending; this ends it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm test
      - run: npm run deploy-check
